<!DOCTYPE html>
<html>
<head>
    <title>Тест кликов</title>
    <style>
        body {
            background: red;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            margin: 0;
            padding: 20px;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .test-button {
            background: blue;
            padding: 20px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
        }
        .test-button:hover {
            background: darkblue;
        }
    </style>
</head>
<body>
    <h1>ТЕСТ КЛИКОВ</h1>
    <div class="test-button" id="testButton">НАЖМИ МЕНЯ</div>
    <div>Клики: <span id="clickCount">0</span></div>
    
    <script>
        let clickCount = 0;
        
        console.log('Тестовый HTML загружен');
        
        // Проверяем доступность Electron API
        if (typeof require !== 'undefined') {
            try {
                const { ipcRenderer } = require('electron');
                console.log('Electron API доступен');
                
                // Обработка клика по кнопке
                document.getElementById('testButton').addEventListener('click', () => {
                    clickCount++;
                    document.getElementById('clickCount').textContent = clickCount;
                    console.log('Клик по кнопке, счетчик:', clickCount);
                    ipcRenderer.send('notification-clicked');
                });
                
                // Обработка клика по body
                document.body.addEventListener('click', (e) => {
                    if (e.target !== document.getElementById('testButton')) {
                        clickCount++;
                        document.getElementById('clickCount').textContent = clickCount;
                        console.log('Клик по body, счетчик:', clickCount);
                        ipcRenderer.send('notification-clicked');
                    }
                });
                
                // Обработка двойного клика
                document.addEventListener('dblclick', () => {
                    clickCount++;
                    document.getElementById('clickCount').textContent = clickCount;
                    console.log('Двойной клик, счетчик:', clickCount);
                    ipcRenderer.send('notification-clicked');
                });
                
            } catch (error) {
                console.error('Ошибка при работе с Electron API:', error);
                document.body.innerHTML = '<h1>ОШИБКА API: ' + error.message + '</h1>';
            }
        } else {
            console.log('Electron API недоступен');
            document.body.innerHTML = '<h1>Electron API недоступен</h1>';
        }
    </script>
</body>
</html>
